<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Language | EverGreen Tutor & Consult</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav>

        <div class="logo">
            EverGreen Tutor & Consult
        </div>

        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="#">English</a></li>
        </ul>

    </nav>

    <section class="subjects">

        <h2>📖 English Language</h2>

        <div class="subject-container">

            <div class="subject-card">
                <h3>Lesson 1</h3>
                <p>Parts of Speech</p>
                <button onclick="lesson1()">Start Lesson</button>
            </div>

            <div class="subject-card">
                <h3>Lesson 2</h3>
                <p>Tenses</p>
                <button onclick="lesson2()">Start Lesson</button>
            </div>

            <div class="subject-card">
                <h3>Lesson 3</h3>
                <p>Essay Writing</p>
                <button onclick="lesson3()">Start Lesson</button>
            </div>

            <div class="subject-card">
                <h3>Lesson 4</h3>
                <p>Comprehension</p>
                <button onclick="lesson4()">Start Lesson</button>
            </div>

        </div>

    </section>

    <div id="lessonBox">

        <h2 id="lessonTitle">Choose a Lesson</h2>

        <p id="lessonContent">
            Click any lesson above to begin.
        </p>

        <br>

        <button onclick="previousLesson()">⬅ Previous Lesson</button>

        <button onclick="nextLesson()">Next Lesson ➡</button>

    </div>

    <div style="text-align:center; margin:30px;">
        <button onclick="chooseSubject('English')">
            📝 Take English Quiz
        </button>
    </div>

    <script>

        let currentLesson = 1;

        function showLesson() {

            let title = document.getElementById("lessonTitle");
            let content = document.getElementById("lessonContent");

            if (currentLesson == 1) {

                title.innerHTML = "📖 Lesson 1";

                content.innerHTML =
                    "<b>Parts of Speech</b><br><br>" +
                    "The eight parts of speech are Noun, Pronoun, Verb, Adjective, Adverb, Preposition, Conjunction and Interjection.";

            }

            else if (currentLesson == 2) {

                title.innerHTML = "📖 Lesson 2";

                content.innerHTML =
                    "<b>Tenses</b><br><br>" +
                    "English has Present, Past and Future tenses.";

            }

            else if (currentLesson == 3) {

                title.innerHTML = "📖 Lesson 3";

                content.innerHTML =
                    "<b>Essay Writing</b><br><br>" +
                    "An essay has three main parts: Introduction, Body and Conclusion.";

            }

            else if (currentLesson == 4) {

                title.innerHTML = "📖 Lesson 4";

                content.innerHTML =
                    "<b>Comprehension</b><br><br>" +
                    "Read the passage carefully before answering the questions.";

            }

        }

        function lesson1() {
            currentLesson = 1;
            document.getElementById("lessonBox").style.display = "block";
            showLesson();
        }

        function lesson2() {
            currentLesson = 2;
            document.getElementById("lessonBox").style.display = "block";
            showLesson();
        }

        function lesson3() {
            currentLesson = 3;
            document.getElementById("lessonBox").style.display = "block";
            showLesson();
        }

        function lesson4() {
            currentLesson = 4;
            document.getElementById("lessonBox").style.display = "block";
            showLesson();
        }

        function nextLesson() {

            if (currentLesson < 4) {
                currentLesson++;
                showLesson();
            }

        }

        function previousLesson() {

            if (currentLesson > 1) {
                currentLesson--;
                showLesson();
            }

        }

    </script>
    
<script src="../js/script.js"></script>

</body>

</html>
