<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics | EverGreen Tutor & Consult</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav>

        <div class="logo">
            EverGreen Tutor & Consult
        </div>

        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="#">Physics</a></li>
        </ul>

    </nav>

    <section class="subjects">

        <h2>⚡ Physics</h2>

        <div class="subject-container">

            <div class="subject-card">
                <h3>Lesson 1</h3>
                <p>Introduction to Physics</p>
                <button onclick="lesson1()">Start Lesson</button>
            </div>

            <div class="subject-card">
                <h3>Lesson 2</h3>
                <p>Force and Motion</p>
                <button onclick="lesson2()">Start Lesson</button>
            </div>

            <div class="subject-card">
                <h3>Lesson 3</h3>
                <p>Energy</p>
                <button onclick="lesson3()">Start Lesson</button>
            </div>

            <div class="subject-card">
                <h3>Lesson 4</h3>
                <p>Electricity</p>
                <button onclick="lesson4()">Start Lesson</button>
            </div>

        </div>

    </section>

    <div id="lessonBox">

        <h2 id="lessonTitle">Choose a Lesson</h2>

        <p id="lessonContent">
            Click any lesson above to begin.
        </p>

        <br>

        <button onclick="previousLesson()">⬅ Previous Lesson</button>

        <button onclick="nextLesson()">Next Lesson ➡</button>

        <br><br>

        <button onclick="startPhysicsQuiz()">
            📝 Take Physics Quiz
        </button>
    </div>

    <script>

        let currentLesson = 1;

        function showLesson() {

            let title = document.getElementById("lessonTitle");
            let content = document.getElementById("lessonContent");

            if (currentLesson == 1) {

                title.innerHTML = "⚡ Lesson 1";

                content.innerHTML =
                    "<b>Introduction to Physics</b><br><br>" +
                    "Physics is the branch of science that studies matter, energy and the forces that act on them.";

            }

            else if (currentLesson == 2) {

                title.innerHTML = "⚡ Lesson 2";

                content.innerHTML =
                    "<b>Force and Motion</b><br><br>" +
                    "Force is a push or pull that can change the motion of an object.";

            }

            else if (currentLesson == 3) {

                title.innerHTML = "⚡ Lesson 3";

                content.innerHTML =
                    "<b>Energy</b><br><br>" +
                    "Energy is the ability to do work. Examples include heat, light and electrical energy.";

            }

            else if (currentLesson == 4) {

                title.innerHTML = "⚡ Lesson 4";

                content.innerHTML =
                    "<b>Electricity</b><br><br>" +
                    "Electricity is the flow of electric charge through a conductor.";

            }

        }

        function lesson1() {

            currentLesson = 1;
            document.getElementById("lessonBox").style.display = "block";
            showLesson();

        }

        function lesson2() {

            currentLesson = 2;
            document.getElementById("lessonBox").style.display = "block";
            showLesson();

        }

        function lesson3() {

            currentLesson = 3;
            document.getElementById("lessonBox").style.display = "block";
            showLesson();

        }

        function lesson4() {

            currentLesson = 4;
            document.getElementById("lessonBox").style.display = "block";
            showLesson();

        }

        function nextLesson() {

            if (currentLesson < 4) {

                currentLesson++;
                showLesson();

            }

        }

        function previousLesson() {

            if (currentLesson > 1) {

                currentLesson--;
                showLesson();

            }

        }

        function startPhysicsQuiz() {

            localStorage.setItem("subject", "Physics");

            window.location.href = "quiz.html";

        }

    </script>

    <script src="../js/script.js"></script>

</body>
</body>

</html>
