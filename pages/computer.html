<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Studies | EverGreen Tutor & Consult</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav>

        <div class="logo">
            EverGreen Tutor & Consult
        </div>

        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="#">Computer Studies</a></li>
        </ul>

    </nav>

    <section class="subjects">

        <h2>💻 Computer Studies</h2>

        <div class="subject-container">

            <div class="subject-card">
                <h3>Lesson 1</h3>
                <p>Introduction to Computers</p>
                <button onclick="lesson1()">Start Lesson</button>
            </div>

            <div class="subject-card">
                <h3>Lesson 2</h3>
                <p>Parts of a Computer</p>
                <button onclick="lesson2()">Start Lesson</button>
            </div>

            <div class="subject-card">
                <h3>Lesson 3</h3>
                <p>Computer Software</p>
                <button onclick="lesson3()">Start Lesson</button>
            </div>

            <div class="subject-card">
                <h3>Lesson 4</h3>
                <p>Internet and Email</p>
                <button onclick="lesson4()">Start Lesson</button>
            </div>

        </div>

    </section>

    <div id="lessonBox">

        <h2 id="lessonTitle">Choose a Lesson</h2>

        <p id="lessonContent">
            Click any lesson above to begin.
        </p>

        <br>

        <button onclick="previousLesson()">⬅ Previous Lesson</button>

        <button onclick="nextLesson()">Next Lesson ➡</button>

        <br><br>

        <button onclick="startComputerQuiz()">
            📝 Take Computer Studies Quiz
        </button>
    </div>

    <script>

        let currentLesson = 1;

        function showLesson() {

            let title = document.getElementById("lessonTitle");
            let content = document.getElementById("lessonContent");

            if (currentLesson == 1) {

                title.innerHTML = "💻 Lesson 1";

                content.innerHTML =
                    "<b>Introduction to Computers</b><br><br>" +
                    "A computer is an electronic device that accepts data, processes it, stores it and produces information.";

            }

            else if (currentLesson == 2) {

                title.innerHTML = "💻 Lesson 2";

                content.innerHTML =
                    "<b>Parts of a Computer</b><br><br>" +
                    "The main parts of a computer include the monitor, keyboard, mouse, CPU and printer.";

            }

            else if (currentLesson == 3) {

                title.innerHTML = "💻 Lesson 3";

                content.innerHTML =
                    "<b>Computer Software</b><br><br>" +
                    "Software is a set of instructions that tells the computer what to do. Examples include Windows and Microsoft Word.";

            }

            else if (currentLesson == 4) {

                title.innerHTML = "💻 Lesson 4";

                content.innerHTML =
                    "<b>Internet and Email</b><br><br>" +
                    "The Internet connects computers worldwide, while email allows people to send and receive electronic messages.";

            }

        }

        function lesson1() {

            currentLesson = 1;
            document.getElementById("lessonBox").style.display = "block";
            showLesson();

        }

        function lesson2() {

            currentLesson = 2;
            document.getElementById("lessonBox").style.display = "block";
            showLesson();

        }

        function lesson3() {

            currentLesson = 3;
            document.getElementById("lessonBox").style.display = "block";
            showLesson();

        }

        function lesson4() {

            currentLesson = 4;
            document.getElementById("lessonBox").style.display = "block";
            showLesson();

        }

        function nextLesson() {

            if (currentLesson < 4) {

                currentLesson++;
                showLesson();

            }

        }

        function previousLesson() {

            if (currentLesson > 1) {

                currentLesson--;
                showLesson();

            }

        }

        function startComputerQuiz() {

            localStorage.setItem("subject", "Computer Studies");

            window.location.href = "quiz.html";

        }
    </script>

    <script src="../js/script.js"></script>

</body>

</html>
