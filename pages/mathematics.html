<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathematics | EverGreen Tutor & Consult</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav>

        <div class="logo">
            EverGreen Tutor & Consult
        </div>

        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="#">Mathematics</a></li>
        </ul>

    </nav>

    <section class="subjects">

        <h2>📘 Mathematics Tutorials</h2>

        <div class="subject-container">

            <div class="subject-card">
                <h3>Lesson 1</h3>
                <p>Introduction to Algebra</p>
                <button onclick="lesson1()">Start Lesson</button>
            </div>

            <div class="subject-card">
                <h3>Lesson 2</h3>
                <p>Linear Equations</p>
                <button onclick="lesson2()">Start Lesson</button>
            </div>

            <div class="subject-card">
                <h3>Lesson 3</h3>
                <p>Geometry</p>
                <button onclick="lesson3()">Start Lesson</button>
            </div>

            <div class="subject-card">
                <h3>Lesson 4</h3>
                <p>Trigonometry</p>
                <button onclick="lesson4()">Start Lesson</button>
            </div>

        </div>

    </section>

    <div id="lessonBox">

        <h2 id="lessonTitle">Choose a lesson</h2>

        <p id="lessonContent">
            Click any lesson above to start learning.
        </p>

        <br>

        <button onclick="previousLesson()">⬅ Previous Lesson</button>

        <button onclick="nextLesson()">Next Lesson ➡</button>

    </div>

    <div style="text-align:center; margin:30px;">
        <button onclick="chooseSubject('Mathematics')">
            📝 Take Mathematics Quiz
        </button>
    </div>

    <script>

        let currentLesson = 1;

        function showLesson() {

            let title = document.getElementById("lessonTitle");
            let content = document.getElementById("lessonContent");

            if (currentLesson == 1) {

                title.innerHTML = "📘 Lesson 1";

                content.innerHTML =
                    "<b>Introduction to Algebra</b><br><br>" +
                    "Algebra uses letters and numbers to solve mathematical problems.<br><br>" +
                    "<b>Example:</b><br>x + 5 = 10<br><br><b>Answer:</b> x = 5";

            }

            else if (currentLesson == 2) {

                title.innerHTML = "📘 Lesson 2";

                content.innerHTML =
                    "<b>Linear Equations</b><br><br>" +
                    "A linear equation has the highest power of 1.<br><br>" +
                    "<b>Example:</b><br>2x + 4 = 10";

            }

            else if (currentLesson == 3) {

                title.innerHTML = "📘 Lesson 3";

                content.innerHTML =
                    "<b>Geometry</b><br><br>" +
                    "Geometry is the study of shapes, lines, angles and figures.";

            }

            else if (currentLesson == 4) {

                title.innerHTML = "📘 Lesson 4";

                content.innerHTML =
                    "<b>Trigonometry</b><br><br>" +
                    "Trigonometry studies triangles, angles and their relationships.";

            }

        }

        function lesson1() {

            currentLesson = 1;

            document.getElementById("lessonBox").style.display = "block";

            showLesson();

        }

        function lesson2() {

            currentLesson = 2;

            document.getElementById("lessonBox").style.display = "block";

            showLesson();

        }

        function lesson3() {

            currentLesson = 3;

            document.getElementById("lessonBox").style.display = "block";

            showLesson();

        }

        function lesson4() {

            currentLesson = 4;

            document.getElementById("lessonBox").style.display = "block";

            showLesson();

        }

        function nextLesson() {

            if (currentLesson < 4) {

                currentLesson++;

                showLesson();

            }

        }

        function previousLesson() {

            if (currentLesson > 1) {

                currentLesson--;

                showLesson();

            }

        }

    </script>


    <script src="../js/script.js"></script>

</body>

</html>
